<!doctype html>
<html lang="{{ page.locale }}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />

        <title>
            {{ page.title | default: site.title }}{% if page.title %} | {{
            site.title }}{% endif %}
        </title>

        <meta name="description" content="{{ site.description }}" />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.6.1/github-markdown-dark.min.css"
        />

        <link
            rel="stylesheet"
            href="{{ '/assets/css/style.css' | relative_url }}"
        />
    </head>

    <body>
        <main class="markdown-body">
            <h1>
                <a href="https://github.com/{{ site.repository }}"
                    >{{ site.title }}</a
                >
            </h1>
            <hr />
            {{ content }}
        </main>
    </body>
</html>
